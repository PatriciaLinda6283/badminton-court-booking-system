<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | BadmintonPro</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .profile-layout { display: grid; grid-template-columns: 280px 1fr; gap: 24px; align-items: start; }
    .avatar-container { text-align: center; padding: 24px; background: #111; border-radius: 8px; border: 1px solid #222; }
    .whatsapp-avatar-box { width: 120px; height: 120px; background: #e4e6eb; border-radius: 50%; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
    .btn-upload { background: #222; color: #fff; border: 1px solid #444; padding: 6px 12px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; display: inline-block; margin-top: 8px; }
    .btn-upload:hover { background: #333; }
    .membership-badge-box { margin-top: 15px; padding: 10px; background: #1a1a1a; border-radius: 6px; font-size: 0.85rem; }
    @media (max-width: 768px) { .profile-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body data-page="profile">
  <div class="app-root">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" style="width: 100%; height: 100%;">
            <circle cx="12" cy="12" r="10" stroke="white" stroke-width="1.2" fill="none" opacity="0.9" />
            <ellipse cx="13.5" cy="10.5" rx="2.2" ry="2.8" transform="rotate(45 13.5 10.5)" stroke="white" stroke-width="1.2" />
            <line x1="11.5" y1="12.5" x2="6.5" y2="17.5" stroke="white" stroke-width="1.2" />
            <line x1="6.5" y1="17.5" x2="5" y2="19" stroke="white" stroke-width="2.2" stroke-linecap="round" />
            <ellipse cx="10.5" cy="10.5" rx="2.2" ry="2.8" transform="rotate(-45 10.5 10.5)" stroke="white" stroke-width="1.2" />
            <line x1="12.5" y1="12.5" x2="17.5" y2="17.5" stroke="white" stroke-width="1.2" />
            <line x1="17.5" y1="17.5" x2="19" y2="19" stroke="white" stroke-width="2.2" stroke-linecap="round" />
            <g fill="white">
              <path d="M12 4.5 C11.6 4.5, 11.3 4.8, 11.3 5.2 C11.3 5.4, 11.4 5.6, 12 6 C12.6 5.6, 12.7 5.4, 12.7 5.2 C12.7 4.8, 12.4 4.5, 12 4.5 Z" />
              <path d="M11.3 5.5 L9.5 8.5 C9.5 8.5, 12 9, 14.5 8.5 L12.7 5.5 Z" opacity="0.85" />
            </g>
          </svg>
        </div>
        <span>Badminton<br>Pro</span>
      </div>
      <div class="sidebar-user">
        <div class="user-name" id="sidebarName">Loading...</div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg> Dashboard</a>
        <a href="booking.html"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Book Court</a>
        <a href="availability.html"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Availability</a>
        <a href="history.html"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.63"/></svg> My Bookings</a>
        <a href="membership.html"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><path d="M20 12V22H4V12"/><path d="M22 7H2v5h20V7z"/><path d="M12 22V7"/></svg> Membership</a>
        <a href="profile.html" class="active"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Profile</a>
      </nav>
      <div class="sidebar-bottom">
        <button class="btn-logout" id="logoutButton">
          <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" width="16" height="16"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Sign Out
        </button>
      </div>
    </aside>
    <main class="main-content">
      <div class="page-header">
        <h1>My Profile</h1>
        <p>Update your personal information and password</p>
      </div>
      
      <div class="profile-layout">
        <div class="avatar-container">
          <div class="whatsapp-avatar-box">
            <!-- Ikon SVG kelabu asal -->
            <svg id="avatarSvg" viewBox="0 0 24 24" style="width: 80px; height: 80px; fill: #8a8d91; margin-top: 20px;">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z"/>
            </svg>
            <!-- Tag Img (gaya paparan akan dikawal oleh JavaScript) -->
            <img id="avatarImage" src="" alt="Profile Picture" style="display: none;">
          </div>
          <label class="btn-upload">
            Change Photo
            <input type="file" id="avatarInput" accept="image/*" style="display: none;">
          </label>
          <div class="membership-badge-box">
            <div style="color: #888; font-size: 0.75rem; text-transform: uppercase;">Membership Status</div>
            <div id="profileMembershipType" style="font-weight: bold; margin-top: 4px; font-size: 1rem; color: var(--white);">Loading...</div>
          </div>
        </div>

        <div class="card" style="margin: 0; max-width: 100%;">
          <div class="card-title">Account Details</div>
          <div class="field">
            <label for="profileName">Full Name</label>
            <input id="profileName" type="text" required>
          </div>
          <div class="field">
            <label for="profilePhone">Phone Number</label>
            <input id="profilePhone" type="tel" required>
          </div>
          <div class="field">
            <label for="profilePassword">New Password</label>
            <input id="profilePassword" type="password" placeholder="Leave blank to keep current">
          </div>
          <p id="profileMessage" class="message"></p>
          <button class="btn btn-primary" id="profileBtn" type="button">Save Changes</button>
        </div>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
